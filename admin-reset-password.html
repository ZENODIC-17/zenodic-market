<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zenodic Admin | Reset Password</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }

    .reset-card {
      width: min(100%, 440px);
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.10);
    }

    .reset-icon {
      font-size: 38px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    p {
      margin: 0 0 24px;
      color: #64748b;
      line-height: 1.6;
    }

    .field {
      display: block;
      margin-bottom: 16px;
    }

    .field span {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 600;
    }

    .password-wrap {
      position: relative;
    }

    input {
      width: 100%;
      min-height: 48px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 0 48px 0 14px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #64748b;
      box-shadow: 0 0 0 3px rgba(100, 116, 139, 0.12);
    }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 8px;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      cursor: pointer;
      font-size: 20px;
      padding: 7px;
    }

    #resetPasswordButton {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      background: #0f172a;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
    }

    #resetPasswordButton:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #resetMessage {
      display: block;
      margin-top: 16px;
      line-height: 1.5;
      font-size: 14px;
    }

    .back-link {
      display: inline-block;
      margin-top: 18px;
      color: #475569;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <main class="reset-card">
    <div class="reset-icon">🔐</div>

    <h1>Reset Admin Password</h1>
    <p>
      Weka password mpya ya akaunti yako ya Zenodic Admin.
    </p>

    <form id="resetPasswordForm">
      <label class="field">
        <span>New Password</span>

        <div class="password-wrap">
          <input
            id="newPassword"
            type="password"
            minlength="8"
            maxlength="128"
            autocomplete="new-password"
            required
          >

          <button
            type="button"
            class="toggle-password"
            data-target="newPassword"
            aria-label="Show password"
          >👁️</button>
        </div>
      </label>

      <label class="field">
        <span>Confirm New Password</span>

        <div class="password-wrap">
          <input
            id="confirmPassword"
            type="password"
            minlength="8"
            maxlength="128"
            autocomplete="new-password"
            required
          >

          <button
            type="button"
            class="toggle-password"
            data-target="confirmPassword"
            aria-label="Show password"
          >👁️</button>
        </div>
      </label>

      <button id="resetPasswordButton" type="submit">
        🔐 Reset Password
      </button>

      <span id="resetMessage"></span>
    </form>

    <a class="back-link" href="/admin-login.html">
      ← Rudi Admin Login
    </a>
  </main>

  <script>
    const resetPasswordForm =
      document.getElementById("resetPasswordForm");

    const newPassword =
      document.getElementById("newPassword");

    const confirmPassword =
      document.getElementById("confirmPassword");

    const resetPasswordButton =
      document.getElementById("resetPasswordButton");

    const resetMessage =
      document.getElementById("resetMessage");

    function showResetMessage(message, success = false) {
      resetMessage.textContent = message;
      resetMessage.style.color = success ? "#15803d" : "#b91c1c";
    }

    document.querySelectorAll(".toggle-password").forEach(button => {
      button.addEventListener("click", () => {
        const input = document.getElementById(button.dataset.target);

        if (!input) return;

        const visible = input.type === "text";
        input.type = visible ? "password" : "text";
        button.textContent = visible ? "👁️" : "🙈";
        button.setAttribute(
          "aria-label",
          visible ? "Show password" : "Hide password"
        );
      });
    });

    resetPasswordForm.addEventListener("submit", async event => {
      event.preventDefault();

      const params = new URLSearchParams(window.location.search);
      const token = params.get("token");

      if (!token) {
        showResetMessage("Reset token haipo au si sahihi.");
        return;
      }

      if (newPassword.value.length < 8) {
        showResetMessage(
          "Password mpya lazima iwe na angalau characters 8."
        );
        return;
      }

      if (newPassword.value !== confirmPassword.value) {
        showResetMessage("Password mpya hazilingani.");
        return;
      }

      resetPasswordButton.disabled = true;
      resetPasswordButton.textContent = "Inabadilisha Password...";
      showResetMessage("");

      try {
        const response = await fetch(
          "/api/admin/password-reset/confirm",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              token,
              newPassword: newPassword.value
            })
          }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(
            data.message || "Password reset imeshindikana."
          );
        }

        showResetMessage(
          "✅ Password imebadilishwa. Sasa unaweza kuingia.",
          true
        );

        newPassword.value = "";
        confirmPassword.value = "";
        resetPasswordButton.textContent = "Password Imeset ✓";

        setTimeout(() => {
          window.location.href = "/admin-login.html";
        }, 1800);

      } catch (error) {
        console.error("ADMIN PASSWORD RESET ERROR:", error);

        showResetMessage(
          "❌ " +
          (error.message || "Password reset imeshindikana.")
        );

        resetPasswordButton.disabled = false;
        resetPasswordButton.textContent = "🔐 Reset Password";
      }
    });
  </script>
</body>
</html>
